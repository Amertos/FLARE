name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repo. No step consumes pull-request
# titles, branch names or comment bodies, so untrusted input never reaches a
# shell (security pass, finding H2).
permissions:
  contents: read

jobs:
  backend:
    name: Backend tests + dossier log
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Engine + API tests
        run: python -m pytest backend/tests -q

      - name: Regenerate dossier section 6 test log
        # Exits non-zero if the shipped engine no longer reproduces the
        # published test log, so documentation drift fails the build.
        run: python -m backend.tools.reproduce_dossier_log

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build
