<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- flame mark -->
  <g transform="translate(96,96)">
    <path d="M60 0 C40 40 12 62 12 96 a48 48 0 0 0 96 0 C108 62 80 40 60 0 Z" fill="none" stroke="#fb923c" stroke-width="6"/>
    <path d="M60 40 C50 62 36 74 36 92 a24 24 0 0 0 48 0 C84 74 70 62 60 40 Z" fill="#fb923c" opacity="0.85"/>
  </g>
  <!-- title -->
  <text x="96" y="318" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="104" font-weight="700" fill="#f8fafc" letter-spacing="4">FLARE</text>
  <text x="96" y="286" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#fb923c" font-weight="600" letter-spacing="2">FIRE &amp; LIFE ATMOSPHERE RISK EXPLORER</text>
  <!-- subtitle -->
  <text x="96" y="392" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#94a3b8">Spacecraft atmosphere fire-risk trade space — computed, not guessed.</text>
  <text x="96" y="438" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#94a3b8">LOC boundary · hazard vector · crew pO₂ · every number cited to NASA.</text>
  <!-- hatched band: honesty motif -->
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#1e293b" stroke-width="5"/>
    </pattern>
  </defs>
  <rect x="96" y="490" width="1008" height="44" fill="url(#hatch)"/>
  <text x="96" y="568" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#64748b">Relative comparison, not absolute risk — no language model anywhere.</text>
</svg>
