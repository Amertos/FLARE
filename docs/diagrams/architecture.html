<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLARE · Architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
--color-paper: #f5f5f5;
--color-ink: #2d3142;
--color-muted: #4f5d75;
--color-accent: #bf4520;
--font-sans: 'Geist', system-ui, sans-serif;
--font-serif: 'Instrument Serif', serif;
--font-mono: 'Geist Mono', ui-monospace, monospace;
}
body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
.frame { max-width: 1200px; width: 100%; }
.eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
svg { width: 100%; min-width: 900px; display: block; }
</style>
</head>
<body>
<div class="frame">
<p class="eyebrow">Architecture · FLARE</p>
<h1>One request, one engine, zero language models</h1>
<svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
<title id="t">FLARE architecture</title>
<desc id="d">React console calls FastAPI; FastAPI calls the pure engine, which reads the curated experiment database. No external service at request time.</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

<!-- Zone: browser -->
<rect x="40" y="140" width="180" height="220" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="96" y="144" width="68" height="12" rx="2" fill="#f5f5f5"/>
<text x="130" y="153" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">BROWSER</text>

<!-- Zone: python process -->
<rect x="300" y="112" width="380" height="276" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

<text x="490" y="125" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">PYTHON PROCESS</text>

<!-- arrows (before nodes) -->
<line x1="220" y1="250" x2="348" y2="250" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="492" y1="286" x2="492" y2="332" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="680" y1="196" x2="728" y2="196" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

<text x="278" y="239" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTP :8787</text>
<rect x="502" y="302" width="44" height="12" rx="2" fill="#f5f5f5"/>
<text x="524" y="311" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READS</text>
<rect x="688" y="176" width="34" height="12" rx="2" fill="#f5f5f5"/>
<text x="705" y="185" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOAD</text>

<!-- Node: React console -->
<rect x="64" y="216" width="156" height="64" rx="6" fill="#f5f5f5"/>

<text x="142" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">React console</text>
<text x="142" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">8 screens · d3 · three.js</text>

<!-- Node: FastAPI -->
<rect x="348" y="216" width="144" height="64" rx="6" fill="#f5f5f5"/>

<text x="372" y="233" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
<text x="420" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FastAPI app</text>
<text x="420" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stateless · no I/O</text>

<!-- Node: engine (focal) -->
<rect x="432" y="152" width="132" height="64" rx="6" fill="#f5f5f5"/>

<text x="498" y="204" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">loc · hazard · epistemics</text>

<!-- Node: database -->
<rect x="572" y="332" width="100" height="64" rx="6" fill="#f5f5f5"/>
<rect x="572" y="332" width="100" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="580" y="340" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
<text x="594" y="349" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
<text x="622" y="368" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">experiments.json</text>
<text x="622" y="384" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">20 curated records</text>

<!-- Node: memo -->
<rect x="776" y="164" width="156" height="64" rx="6" fill="#f5f5f5"/>
<rect x="776" y="164" width="156" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="784" y="172" width="44" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
<text x="806" y="181" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ARTIFACT</text>
<text x="854" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Decision memo</text>
<text x="854" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Markdown · /api/report</text>

<!-- No-LLM callout -->
<text x="500" y="428" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">No LLM · no external call at request time · deterministic: same input, same output</text>
<line x1="40" y1="444" x2="960" y2="444" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
</svg>
</div>
</body>
</html>
