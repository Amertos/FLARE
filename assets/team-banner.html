<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>FLARE — wide banner</title>
<style>
  * { margin: 0; box-sizing: border-box; }
  .stage {
    width: 1500px; height: 500px; position: relative; overflow: hidden;
    background:
      radial-gradient(800px 400px at 92% -20%, #1c2a4d 0%, transparent 60%),
      radial-gradient(500px 300px at 2% 120%, #26102a 0%, transparent 60%),
      linear-gradient(150deg, #0b1220 0%, #101a2e 60%, #0c1120 100%);
    font-family: 'Segoe UI', system-ui, sans-serif; color: #e8eefc;
    display: flex;
  }
  .stars { position: absolute; inset: 0; }
  .s { position: absolute; border-radius: 50%; background: #cfe1ff; }

  .left {
    flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center;
    padding: 0 30px 0 90px;
  }
  .eyebrow { font-size: 18px; letter-spacing: .38em; text-transform: uppercase; color: #8fa7d8; font-weight: 600; }

  .mark { display: flex; align-items: center; gap: 20px; margin: 18px 0 10px; }
  .flame { height: 108px; }
  h1 {
    font-size: 108px; font-weight: 800; letter-spacing: .045em; line-height: .95;
    background: linear-gradient(100deg, #ffd28a 0%, #ff9a5a 45%, #f2634f 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-size: 26px; color: #c8d6f2; font-weight: 500; }
  .tag { font-size: 18px; color: #93a5cc; margin-top: 14px; }
  .tag b { color: #d7e2f7; font-weight: 600; }

  .right {
    flex: 0 0 430px; display: flex; flex-direction: column; justify-content: center; gap: 14px;
    padding: 0 80px 0 30px;
    border-left: 1px solid #26355c;
    margin: 70px 0;
  }
  .stat { display: flex; align-items: baseline; gap: 12px; }
  .stat .n { font-size: 34px; font-weight: 800; color: #ffc08a; font-variant-numeric: tabular-nums; }
  .stat .l { font-size: 15px; color: #93a5cc; text-transform: uppercase; letter-spacing: .12em; }

  .foot {
    position: absolute; bottom: 0; left: 0; right: 0; height: 6px;
    background: linear-gradient(90deg, #ffdd9a, #ff8a4d 40%, #b24a3f 75%, #274a8f 100%);
  }
  .tick { position: absolute; width: 26px; height: 26px; border-color: #3d4f7d; border-style: solid; }
  .tl { top: 20px; left: 20px; border-width: 2px 0 0 2px; }
  .tr { top: 20px; right: 20px; border-width: 2px 2px 0 0; }
  .bl { bottom: 20px; left: 20px; border-width: 0 0 2px 2px; }
  .br { bottom: 20px; right: 20px; border-width: 0 2px 2px 0; }
</style>
</head>
<body>
<div class="stage">
  <div class="stars" id="stars"></div>
  <div class="tick tl"></div><div class="tick tr"></div>
  <div class="tick bl"></div><div class="tick br"></div>

  <div class="left">
    <div class="eyebrow">NASA Space Apps 2026 &middot; Flame in Freefall</div>
    <div class="mark">
      <svg class="flame" viewBox="0 0 64 132" fill="none">
        <defs>
          <linearGradient id="fg" x1="0" y1="132" x2="0" y2="0">
            <stop offset="0" stop-color="#f2634f"/><stop offset=".55" stop-color="#ff9a5a"/><stop offset="1" stop-color="#ffdd9a"/>
          </linearGradient>
        </defs>
        <path d="M32 4 C50 34 62 56 62 84 c0 26-13 44-30 44 S2 110 2 84 c0-18 6-30 14-42 3 10 8 16 14 18 -4-22 2-40 2-56z" fill="url(#fg)"/>
      </svg>
      <h1>FLARE</h1>
    </div>
    <div class="sub">Fire &amp; Life Atmosphere Risk Explorer</div>
    <p class="tag">Evidence-traced fire risk for <b>spacecraft &amp; habitat atmospheres</b> in microgravity.</p>
  </div>

  <div class="right">
    <div class="stat"><span class="n">20</span><span class="l">Evidence records</span></div>
    <div class="stat"><span class="n">95</span><span class="l">Tests passing</span></div>
    <div class="stat"><span class="n">6</span><span class="l">Console screens</span></div>
    <div class="stat"><span class="n">100%</span><span class="l">Cited claims</span></div>
  </div>

  <div class="foot"></div>
</div>
<script>
  const box = document.getElementById('stars');
  let seed = 11;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 80; i++) {
    const d = document.createElement('div');
    d.className = 's';
    const r = rnd() * 2 + 0.6;
    d.style.width = r + 'px'; d.style.height = r + 'px';
    d.style.left = (rnd() * 100) + '%';
    d.style.top = (rnd() * 100) + '%';
    d.style.opacity = 0.25 + rnd() * 0.5;
    box.appendChild(d);
  }
</script>
</body>
</html>
